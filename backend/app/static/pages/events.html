<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Explorer — ULPF Console</title>
<script src="/static/js/theme.js"></script>
<link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/vendor/icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
<div id="app-shell-root"></div>

<script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/shell.js"></script>
<script>
let currentPage = 1;
const PAGE_SIZE = 50;

if (requireAuth()) {
  renderShell("events.html");
  document.getElementById("page-content").innerHTML = `
    <div class="panel">
      <div class="panel-body">
        <div class="row g-3 mb-2">
          <div class="col-md-3"><label class="form-label small">Free text (message)</label><input class="form-control" id="f-q" placeholder="search message…"></div>
          <div class="col-md-3"><label class="form-label small">IP (source or destination)</label><input class="form-control" id="f-ip" placeholder="192.168.1.10"></div>
          <div class="col-md-3"><label class="form-label small">Vendor</label><input class="form-control" id="f-vendor" placeholder="Fortinet"></div>
          <div class="col-md-3"><label class="form-label small">Protocol</label><input class="form-control" id="f-protocol" placeholder="tcp"></div>
        </div>
        <div class="row g-3">
          <div class="col-md-3"><label class="form-label small">Action</label><input class="form-control" id="f-action" placeholder="deny"></div>
          <div class="col-md-3"><label class="form-label small">Severity</label><input class="form-control" id="f-severity" placeholder="critical"></div>
          <div class="col-md-3">
            <label class="form-label small">Normalization status</label>
            <select class="form-select" id="f-status">
              <option value="">— any —</option>
              <option value="success">success</option>
              <option value="partial">partial</option>
              <option value="failed">failed</option>
              <option value="unrecognized">unrecognized</option>
            </select>
          </div>
          <div class="col-md-3 d-flex align-items-end">
            <button class="btn btn-primary w-100" onclick="runSearch()"><i class="bi bi-search me-1"></i>Search</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title mb-0">Results</h2>
        <span class="text-body-secondary" id="result-count" style="font-size:0.78rem;"></span>
      </div>
      <div class="panel-body flush table-responsive">
        <table class="table table-clean mb-0">
          <thead><tr>
            <th>Time</th><th>Status</th><th>Vendor</th><th>Device</th><th>Src IP</th><th>Dst IP</th>
            <th>Proto</th><th>Action</th><th>Severity</th><th>Message</th>
          </tr></thead>
          <tbody id="events-body"><tr><td colspan="10" class="text-body-secondary">Loading…</td></tr></tbody>
        </table>
      </div>
      <div class="d-flex align-items-center gap-3 p-3 border-top">
        <button class="btn btn-sm btn-outline-secondary" id="prev-btn" onclick="changePage(-1)">&larr; Prev</button>
        <span class="text-body-secondary small" id="page-label"></span>
        <button class="btn btn-sm btn-outline-secondary" id="next-btn" onclick="changePage(1)">Next &rarr;</button>
      </div>
    </div>

    <div class="modal fade" id="detail-modal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Event detail</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body" id="detail-modal-body"><div class="text-body-secondary">Loading…</div></div>
        </div>
      </div>
    </div>
  `;
  runSearch();
}

function currentFilters() {
  return {
    q: document.getElementById("f-q").value,
    ip: document.getElementById("f-ip").value,
    vendor: document.getElementById("f-vendor").value,
    protocol: document.getElementById("f-protocol").value,
    action: document.getElementById("f-action").value,
    severity: document.getElementById("f-severity").value,
    normalization_status: document.getElementById("f-status").value,
  };
}

function runSearch() { currentPage = 1; loadEvents(); }
function changePage(delta) { currentPage = Math.max(1, currentPage + delta); loadEvents(); }

async function loadEvents() {
  try {
    const res = await API.get("/api/events", { ...currentFilters(), page: currentPage, page_size: PAGE_SIZE });
    document.getElementById("result-count").textContent = `${res.total} total`;
    document.getElementById("page-label").textContent = `page ${res.page} of ${Math.max(1, Math.ceil(res.total / PAGE_SIZE))}`;
    document.getElementById("prev-btn").disabled = res.page <= 1;
    document.getElementById("next-btn").disabled = res.page * PAGE_SIZE >= res.total;

    const body = document.getElementById("events-body");
    if (!res.items.length) {
      body.innerHTML = `<tr><td colspan="10"><div class="empty-state"><i class="bi bi-search"></i>No events match these filters.</div></td></tr>`;
      return;
    }
    body.innerHTML = res.items.map(ev => `
      <tr class="row-clickable" onclick="openDetail('${ev.event_id}')">
        <td class="text-body-secondary font-mono" style="white-space:nowrap;">${fmtTime(ev.event_timestamp || ev.ingest_timestamp)}${ev.timestamp_uncertain ? ' <span class="text-body-tertiary">(≈)</span>' : ''}</td>
        <td><span class="status-badge ${statusBadgeClass(ev.status)}">${ev.status}</span></td>
        <td>${escapeHtml(ev.vendor || "—")}</td>
        <td>${escapeHtml(ev.device_name || "—")}</td>
        <td class="font-mono">${escapeHtml(ev.source_ip || "—")}</td>
        <td class="font-mono">${escapeHtml(ev.destination_ip || "—")}</td>
        <td>${escapeHtml(ev.protocol || "—")}</td>
        <td>${escapeHtml(ev.action || "—")}</td>
        <td><span class="status-badge ${severityBadgeClass(ev.severity)}">${escapeHtml(ev.severity || "unknown")}</span></td>
        <td style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(ev.message || "—")}</td>
      </tr>`).join("");
  } catch (err) { toast(err.message, "error"); }
}

async function openDetail(eventId) {
  const modalEl = document.getElementById("detail-modal");
  const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
  document.getElementById("detail-modal-body").innerHTML = `<div class="text-body-secondary">Loading…</div>`;
  modal.show();

  try {
    const d = await API.get(`/api/events/${eventId}`);
    document.getElementById("detail-modal-body").innerHTML = `
      <div class="mb-3">
        <span class="status-badge ${statusBadgeClass(d.normalization.status)}">${d.normalization.status}</span>
        <span class="status-badge ${severityBadgeClass(d.event.severity)} ms-1">${escapeHtml(d.event.severity || "unknown severity")}</span>
      </div>
      <dl class="kv-grid">
        <dt>Event ID</dt><dd>${escapeHtml(d.event_id)}</dd>
        <dt>Event time</dt><dd>${d.event_timestamp ? fmtTime(d.event_timestamp) : "undetermined"} ${d.timestamp_uncertain ? "(uncertain)" : ""}</dd>
        <dt>Raw timestamp text</dt><dd>${escapeHtml(d.event_timestamp_raw || "—")}</dd>
        <dt>Ingest time</dt><dd>${fmtTime(d.ingest_timestamp)}</dd>
        <dt>Vendor / device</dt><dd>${escapeHtml(d.source.vendor || "—")} / ${escapeHtml(d.source.device_name || "—")}</dd>
        <dt>Category / type</dt><dd>${escapeHtml(d.event.category || "—")} / ${escapeHtml(d.event.type || "—")}</dd>
        <dt>Action / outcome</dt><dd>${escapeHtml(d.event.action || "—")} / ${escapeHtml(d.event.outcome || "—")}</dd>
        <dt>Source ip:port</dt><dd>${escapeHtml(d.network.source_ip || "—")}${d.network.source_port ? ":" + d.network.source_port : ""}</dd>
        <dt>Destination ip:port</dt><dd>${escapeHtml(d.network.destination_ip || "—")}${d.network.destination_port ? ":" + d.network.destination_port : ""}</dd>
        <dt>Protocol</dt><dd>${escapeHtml(d.network.protocol || "—")}</dd>
        <dt>Parser used</dt><dd>${escapeHtml(d.normalization.parser_name || "—")} v${escapeHtml(d.normalization.parser_version || "?")}</dd>
        <dt>Raw event ID</dt><dd>${escapeHtml(d.raw_event.raw_event_id)}</dd>
        <dt>Content hash (SHA-256)</dt><dd style="font-size:0.72rem;">${escapeHtml(d.integrity.content_hash)}</dd>
        <dt>Integrity check</dt><dd>${d.integrity.hash_match ? '<span class="status-badge ok">verified</span>' : d.integrity.hash_match === false ? '<span class="status-badge danger">mismatch</span>' : '<span class="status-badge unknown">requires analyst role</span>'}</dd>
      </dl>

      ${d.normalization.warnings.length ? `
        <div class="mt-3">
          <div class="text-body-secondary small mb-1">Warnings</div>
          <ul class="small text-warning-emphasis ps-3 mb-0">
            ${d.normalization.warnings.map(w => `<li>${escapeHtml(w)}</li>`).join("")}
          </ul>
        </div>` : ""}

      ${Object.keys(d.vendor_fields || {}).length ? `
        <div class="mt-3">
          <div class="text-body-secondary small mb-1">Vendor-specific fields (preserved, unmapped)</div>
          <pre class="raw-block">${escapeHtml(JSON.stringify(d.vendor_fields, null, 2))}</pre>
        </div>` : ""}

      <div class="mt-3">
        <div class="text-body-secondary small mb-1">Original raw event (verbatim)</div>
        ${d.raw_event.raw_message
          ? `<pre class="raw-block">${escapeHtml(d.raw_event.raw_message)}</pre>`
          : `<div class="empty-state py-3"><i class="bi bi-lock"></i>Raw log content requires the 'analyst' role or higher.</div>`}
      </div>
    `;
  } catch (err) {
    document.getElementById("detail-modal-body").innerHTML = `<span class="text-danger">${escapeHtml(err.message)}</span>`;
  }
}
</script>
</body>
</html>
