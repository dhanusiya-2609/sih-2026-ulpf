<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding — ULPF Console</title>
<script src="/static/js/theme.js"></script>
<link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/vendor/icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
<div id="app-shell-root"></div>

<script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/shell.js"></script>
<script>
if (requireAuth()) {
  renderShell("training.html");
  document.getElementById("page-content").innerHTML = `
    <div class="alert d-flex align-items-start gap-2 mb-3" style="background:var(--app-surface-2); border:1px solid var(--app-border); color:var(--app-text);">
      <i class="bi bi-info-circle mt-1"></i>
      <div class="small">
        Suggestions below are generated by an <strong>offline, deterministic heuristic</strong>
        (string-similarity matching, no network access, no paid API) — never applied
        automatically. Review and approve before they take effect.
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title mb-0">Unrecognized / partial samples</h2>
        <button class="btn btn-sm btn-outline-secondary" onclick="loadSamples()"><i class="bi bi-arrow-clockwise"></i></button>
      </div>
      <div class="panel-body flush table-responsive">
        <table class="table table-clean mb-0">
          <thead><tr><th>Status</th><th>Parser</th><th>Source</th><th>Sample</th><th></th></tr></thead>
          <tbody id="samples-body"><tr><td colspan="5" class="text-body-secondary">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><h2 class="panel-title mb-0">Pending &amp; reviewed mappings</h2></div>
      <div class="panel-body flush table-responsive">
        <table class="table table-clean mb-0">
          <thead><tr><th>Created</th><th>Suggestion source</th><th>Status</th><th>Fields</th></tr></thead>
          <tbody id="records-body"><tr><td colspan="4" class="text-body-secondary">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="modal fade" id="suggest-modal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Review suggested mapping</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body" id="suggest-modal-body"></div>
        </div>
      </div>
    </div>
  `;
  loadSamples();
  loadRecords();
}

async function loadSamples() {
  try {
    const samples = await API.get("/api/training/unknown-samples", { limit: 20 });
    const body = document.getElementById("samples-body");
    if (!samples.length) {
      body.innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="bi bi-magic"></i>No unrecognized or partial events right now.</div></td></tr>`;
      return;
    }
    body.innerHTML = samples.map(s => `
      <tr>
        <td><span class="status-badge ${statusBadgeClass(s.status)}">${s.status}</span></td>
        <td class="font-mono">${escapeHtml(s.parser_name || "—")}</td>
        <td class="font-mono">${escapeHtml(s.source_id || "—")}</td>
        <td class="font-mono" style="max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(s.raw_message || "")}</td>
        <td><button class="btn btn-sm btn-outline-secondary" onclick='requestSuggestion(${JSON.stringify(s.raw_event_id)})'>Suggest mapping</button></td>
      </tr>`).join("");
  } catch (err) { toast(err.message, "error"); }
}

async function requestSuggestion(rawEventId) {
  try {
    const res = await API.post(`/api/training/suggest/${rawEventId}`, {});
    openSuggestionModal(res);
  } catch (err) { toast(err.message, "error"); }
}

function openSuggestionModal(res) {
  const fieldRows = Object.entries(res.sample_fields).map(([k, v]) => {
    const suggestion = res.suggested_mapping[k];
    return `
      <div class="row g-2 align-items-end mb-2">
        <div class="col-6"><label class="form-label small">${escapeHtml(k)}</label><input class="form-control form-control-sm" value="${escapeHtml(String(v))}" disabled></div>
        <div class="col-6">
          <label class="form-label small">Maps to ${suggestion ? `<span class="text-body-tertiary">(confidence ${suggestion.confidence})</span>` : '<span class="text-body-tertiary">(no confident suggestion)</span>'}</label>
          <input class="form-control form-control-sm map-target-input" data-source-field="${escapeHtml(k)}" value="${escapeHtml(suggestion ? suggestion.target : "")}" placeholder="e.g. network.source_ip">
        </div>
      </div>`;
  }).join("");

  document.getElementById("suggest-modal-body").innerHTML = `
    <div class="form-text mb-3">${escapeHtml(res.disclaimer)} Source: <span class="font-mono">${escapeHtml(res.suggestion_source)}</span></div>
    ${fieldRows}
    <button class="btn btn-primary w-100 mt-2" onclick="approveSuggestion('${res.training_record_id}')">Approve mapping</button>
  `;
  const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById("suggest-modal"));
  modal.show();
}

async function approveSuggestion(recordId) {
  const inputs = document.querySelectorAll(".map-target-input");
  const finalMapping = {};
  inputs.forEach(i => { if (i.value.trim()) finalMapping[i.dataset.sourceField] = i.value.trim(); });
  if (!Object.keys(finalMapping).length) { toast("Map at least one field before approving", "error"); return; }
  try {
    await API.post(`/api/training/records/${recordId}/approve`, { final_mapping: finalMapping });
    toast("Mapping approved", "success");
    bootstrap.Modal.getOrCreateInstance(document.getElementById("suggest-modal")).hide();
    loadRecords();
  } catch (err) { toast(err.message, "error"); }
}

async function loadRecords() {
  try {
    const records = await API.get("/api/training/records");
    const body = document.getElementById("records-body");
    if (!records.length) {
      body.innerHTML = `<tr><td colspan="4"><div class="empty-state"><i class="bi bi-clipboard-check"></i>No onboarding requests yet.</div></td></tr>`;
      return;
    }
    body.innerHTML = records.map(r => `
      <tr>
        <td class="text-body-secondary">${fmtTime(r.created_at)}</td>
        <td class="font-mono">${escapeHtml(r.suggestion_source)}</td>
        <td><span class="status-badge ${r.status === 'approved' ? 'ok' : r.status === 'rejected' ? 'danger' : 'unknown'}">${escapeHtml(r.status)}</span></td>
        <td class="font-mono">${Object.keys(r.final_mapping || r.suggested_mapping || {}).length}</td>
      </tr>`).join("");
  } catch (err) { toast(err.message, "error"); }
}
</script>
</body>
</html>
