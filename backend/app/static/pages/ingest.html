<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingestion — ULPF Console</title>
<script src="/static/js/theme.js"></script>
<link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/vendor/icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
<div id="app-shell-root"></div>

<script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/shell.js"></script>
<script>
if (requireAuth()) {
  renderShell("ingest.html");
  document.getElementById("page-content").innerHTML = `
    <div class="panel">
      <div class="panel-header"><h2 class="panel-title mb-0">Upload files</h2></div>
      <div class="panel-body">
        <form id="upload-form">
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label small">Attach to source (optional)</label>
              <select class="form-select" name="source_id" id="source-select"><option value="">— none / auto —</option></select>
              <div class="form-text">Without a source, events still normalize but vendor/device metadata stays unset.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label small">Force parser (optional)</label>
              <select class="form-select" name="parser_name" id="parser-select"><option value="">— auto-detect —</option></select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label small">Log file(s)</label>
            <input type="file" class="form-control" name="files" id="file-input" multiple required>
            <div class="form-text">Select multiple files for a bulk upload job (one job per file).</div>
          </div>
          <button class="btn btn-primary" type="submit" id="upload-btn"><i class="bi bi-cloud-arrow-up me-1"></i>Upload &amp; process</button>
        </form>
        <div id="upload-result" class="mt-3"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title mb-0">Recent ingestion jobs</h2>
        <button class="btn btn-sm btn-outline-secondary" onclick="loadJobs()"><i class="bi bi-arrow-clockwise"></i></button>
      </div>
      <div class="panel-body flush table-responsive">
        <table class="table table-clean mb-0">
          <thead><tr><th>Started</th><th>File</th><th>Type</th><th>Total</th><th>Success</th><th>Partial</th><th>Failed</th><th>Status</th></tr></thead>
          <tbody id="jobs-body"><tr><td colspan="8" class="text-body-secondary">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  `;
  init();
}

async function init() {
  try {
    const [sources, parsers] = await Promise.all([API.get("/api/sources"), API.get("/api/parsers")]);
    document.getElementById("source-select").innerHTML += sources.map(s =>
      `<option value="${escapeHtml(s.source_id)}">${escapeHtml(s.source_id)} (${escapeHtml(s.vendor)})</option>`).join("");
    document.getElementById("parser-select").innerHTML += parsers.map(p =>
      `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)} — ${escapeHtml(p.format_family)}</option>`).join("");
  } catch (err) { toast(err.message, "error"); }

  document.getElementById("upload-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const files = document.getElementById("file-input").files;
    if (!files.length) return;
    const sourceId = document.getElementById("source-select").value;
    const parserName = document.getElementById("parser-select").value;
    const btn = document.getElementById("upload-btn");
    btn.disabled = true; btn.innerHTML = "Processing…";

    try {
      let resultHtml = "";
      if (files.length === 1) {
        const fd = new FormData(); fd.append("file", files[0]);
        const res = await API.postForm("/api/ingest/upload", fd, { source_id: sourceId || undefined, parser_name: parserName || undefined });
        resultHtml = renderJobResult(res);
      } else {
        const fd = new FormData();
        for (const f of files) fd.append("files", f);
        const res = await API.postForm("/api/ingest/bulk-upload", fd, { source_id: sourceId || undefined, parser_name: parserName || undefined });
        resultHtml = res.map(renderJobResult).join("");
      }
      document.getElementById("upload-result").innerHTML = resultHtml;
      toast("Upload processed", "success");
      loadJobs();
    } catch (err) {
      toast(err.message, "error");
    } finally {
      btn.disabled = false; btn.innerHTML = '<i class="bi bi-cloud-arrow-up me-1"></i>Upload & process';
    }
  });

  loadJobs();
}

function renderJobResult(r) {
  return `
    <div class="panel" style="margin-top:0;">
      <div class="panel-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <strong class="font-mono">${escapeHtml(r.filename || r.job_id)}</strong>
          <span class="status-badge ${r.status === 'completed' ? 'ok' : 'warn'}">${r.status}</span>
        </div>
        <div class="row g-2">
          <div class="col-3"><div class="stat-card"><div class="stat-value">${r.total_events}</div><div class="stat-label">Total</div></div></div>
          <div class="col-3"><div class="stat-card tone-ok"><div class="stat-value">${r.success_count}</div><div class="stat-label">Success</div></div></div>
          <div class="col-3"><div class="stat-card tone-warn"><div class="stat-value">${r.partial_count}</div><div class="stat-label">Partial</div></div></div>
          <div class="col-3"><div class="stat-card tone-danger"><div class="stat-value">${r.failed_count}</div><div class="stat-label">Failed</div></div></div>
        </div>
        <a href="events.html" class="d-inline-block mt-2">View events <i class="bi bi-arrow-right"></i></a>
      </div>
    </div>`;
}

async function loadJobs() {
  try {
    const jobs = await API.get("/api/ingest/jobs", { limit: 30 });
    const body = document.getElementById("jobs-body");
    if (!jobs.length) {
      body.innerHTML = `<tr><td colspan="8"><div class="empty-state"><i class="bi bi-inbox"></i>No ingestion jobs yet.</div></td></tr>`;
      return;
    }
    body.innerHTML = jobs.map(j => `
      <tr>
        <td class="text-body-secondary">${fmtTime(j.started_at)}</td>
        <td class="font-mono">${escapeHtml(j.filename || "—")}</td>
        <td>${escapeHtml(j.job_type)}</td>
        <td class="font-mono">${j.total_events}</td>
        <td class="font-mono">${j.success_count}</td>
        <td class="font-mono">${j.partial_count}</td>
        <td class="font-mono">${j.failed_count}</td>
        <td><span class="status-badge ${j.status === 'completed' ? 'ok' : 'unknown'}">${escapeHtml(j.status)}</span></td>
      </tr>`).join("");
  } catch (err) { toast(err.message, "error"); }
}
</script>
</body>
</html>
